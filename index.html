<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Cloud Cost Navigator</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}input{padding:.5rem;width:110px}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>🧭 Cloud Cost Navigator</h1><p>Compare on-demand vs committed pricing scenarios.</p><label>Monthly on-demand spend ($): <input id="s" type="number" value="10000"></label> <label>Steady-state share (%): <input id="p" type="number" value="70"></label> <button onclick="go()">Compare</button><div id="out"></div><script>function go(){const s=+document.getElementById('s').value,p=+document.getElementById('p').value/100;const c1=Math.round(s*p*0.35),c3=Math.round(s*p*0.55);document.getElementById('out').textContent=`Current: $${s.toLocaleString()}/mo on-demand\n1-yr commitments: save ~$${c1.toLocaleString()}/mo\n3-yr commitments: save ~$${c3.toLocaleString()}/mo\nAnnual delta (3-yr): $${(c3*12).toLocaleString()}\n\n⚠️ Don't forget egress + idle resources — full navigator models both.\nCross-cloud architecture advice: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/zion-ai-cloud-cost-navigator">GitHub</a> · <a href="https://ziontechgroup.com/ai-finops-suite/">FinOps Suite</a></p></body></html>
